# Validates Round-1-FINAL builds on push. Hosting: connect Vercel + Render to this branch (see docs/DEPLOY_ROUND1.md).
name: Round 1 — build check

on:
  push:
    branches: [Round-1-FINAL]
  workflow_dispatch:

concurrency:
  group: round1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Pytest (offline)
        run: python -m pytest backend -q --tb=line
        env:
          DEMO_MODE: replay

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://example.onrender.com